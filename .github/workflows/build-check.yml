name: Build Check
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile (no signing)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project ColorMixNavi.xcodeproj -scheme ColorMixNavi
          xcodebuild build \
            -project ColorMixNavi.xcodeproj \
            -scheme ColorMixNavi \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
